summary: C++ header-only HTTP/HTTPS server and client library
src-url: https://github.com/yhirose/cpp-httplib/archive/refs/tags/v0.65.0.tar.gz
src-sha: 6fda8f23ff811a751c2b6e694fe2f1aa1625df53a317110329ef57a18f9fa5fb
license: MIT
dep-pkg: libz libbrotli libopenssl
install: |
    cmakew \
        -DHTTPLIB_REQUIRE_ZLIB=ON \
        -DHTTPLIB_REQUIRE_BROTLI=ON \
        -DHTTPLIB_REQUIRE_OPENSSL=ON
