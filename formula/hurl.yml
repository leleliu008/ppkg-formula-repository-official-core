summary: Run and Test HTTP Requests with plain text and curl
web-url: https://hurl.dev
src-url: https://github.com/Orange-OpenSource/hurl/archive/refs/tags/8.1.0.tar.gz
src-sha: 2e45678806a8a1c7307d4b4298b11aab6d947799bdce986c67fd9c693dac98a5
license: Apache-2.0
dep-pkg: libcurl libxml2
dep-lib: libcurl libxml-2.0

# https://github.com/KWARC/rust-libxml
prepare: |
    if [ "$TARGET_PLATFORM_NAME" = macos ] ; then
        export RUSTFLAGS="$RUSTFLAGS -Clink-arg=-framework -Clink-arg=SystemConfiguration"
    fi

    if [ "$NATIVE_PLATFORM_TYPE" = linux ] ; then
        if test -x    /sbin/apk ; then
            run $sudo /sbin/apk update
            run $sudo /sbin/apk add llvm21-dev clang21-dev

            export LLVM_CONFIG_PATH=/usr/lib/llvm21/bin/llvm-config
            export LIBCLANG_PATH=/usr/lib/libclang.so

            return 0
        fi

        if test -x    /usr/bin/apt ; then
            run $sudo /usr/bin/apt -y update
            run $sudo /usr/bin/apt -y install libclang-dev
        fi
    fi

install: |
    cargow install --locked --path packages/hurl
    cargow install --locked --path packages/hurlfmt
    install_mans docs/manual/hurl.1
    install_mans docs/manual/hurlfmt.1
