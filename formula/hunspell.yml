src-sha: 433274dac0619cb00c2e18b43a3dd3a9d50da5b5613fa9b5c21781e35dd76bc1
license: GPL-2.0-or-later
dep-pkg: libreadline
dep-upp: gettext-tools xz

install: |
    configure \
        --with-ui \
        --with-readline \
        --with-warnings \
        --enable-static \
        --disable-shared
