summary: Cross-platform make
web-url: https://www.cmake.org/
src-url: https://github.com/Kitware/CMake/releases/download/v3.31.12/cmake-3.31.12.tar.gz
src-sha: 5f3fd5a54dfa65602bdbed64f981a72673cc19f2d304cc2955cf0dfa0cfd8272
license: BSD-3-Clause
dep-pkg: libncurses libopenssl
ldflags: -lpthread

install: |
    cmakew \
        -DCMAKE_USE_SYSTEM_LIBRARIES=OFF \
        -DCMAKE_USE_OPENSSL=ON \
        -DCMake_BUILD_LTO=ON \
        -DBUILD_QtDialog=OFF \
        -DBUILD_CursesDialog=ON

dopatch: printf 'set(LIBIDN2_FOUND FALSE)\n' > Utilities/cmcurl/CMake/FindLibidn2.cmake

prepare: |
    # http://mail-index.netbsd.org/pkgsrc-users/2024/12/25/msg040726.html
    if [ "$TARGET_PLATFORM_NAME" = netbsd ] ; then
        case "$TARGET_PLATFORM_VERS" in
            9.*) export CXXFLAGS="$CXXFLAGS -D_NETBSD_SOURCE"
        esac
    fi
