summary: Free lossless audio codec
web-url: https://xiph.org/flac/
src-url: https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0.tar.xz
src-sha: f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920
license: GFDL-1.2-or-later
dep-pkg: libogg

prepare: |
    if [ "$TARGET_PLATFORM_NAME" = macos ] ; then
        export LDFLAGS="$LDFLAGS -framework CoreFoundation"
    fi

install: |
    cmakew \
        -DWITH_OGG=ON \
        -DBUILD_CXXLIBS=ON \
        -DBUILD_PROGRAMS=ON \
        -DBUILD_EXAMPLES=ON \
        -DBUILD_DOCS=OFF \
        -DINSTALL_MANPAGES=ON \
        -DINSTALL_PKGCONFIG_MODULES=OFF \
        -DINSTALL_CMAKE_CONFIG_MODULE=OFF

dotweak: rm -rf include/ lib/
