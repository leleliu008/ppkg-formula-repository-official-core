summary: Savoury implementation of the QUIC transport protocol and HTTP/3
src-url: https://github.com/cloudflare/quiche/archive/refs/tags/0.30.1.tar.gz
src-sha: c2c55d42677f0f1f42045e4c3e31469dc2107059bb519551b4c1c5a42f662a51
license: BSD-2-Clause
dep-pkg: libfontconfig
bsystem: cargo cmake

prepare: |
    if [ "$NATIVE_PLATFORM_TYPE" = linux ] ; then
        if test -x    /sbin/apk ; then
            run $sudo /sbin/apk update
            run $sudo /sbin/apk add llvm21-dev clang21-dev

            export LLVM_CONFIG_PATH=/usr/lib/llvm21/bin/llvm-config
            export LIBCLANG_PATH=/usr/lib/libclang.so

            return 0
        fi

        if test -x    /usr/bin/apt ; then
            run $sudo /usr/bin/apt -y update
            run $sudo /usr/bin/apt -y install libclang-dev
        fi
    fi

install: |
    cargow build --lib --features ffi,pkg-config-meta
    install_incs quiche/include/quiche.h
    install_libs target/$RUST_TARGET/release/libquiche.a
    install_pcfs target/$RUST_TARGET/release/quiche.pc

    if [ -f "target/$RUST_TARGET/release/libquiche$SHARED_LIBRARY_SUFFIX" ] ; then
    install_libs target/$RUST_TARGET/release/libquiche$SHARED_LIBRARY_SUFFIX
    fi
