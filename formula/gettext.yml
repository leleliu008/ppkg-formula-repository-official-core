summary: GNU internationalization (i18n) and localization (l10n) library
src-url: https://ftp.gnu.org/gnu/gettext/gettext-1.0.tar.gz
src-sha: 85d99b79c981a404874c02e0342176cf75c7698e2b51fe41031cf6526d974f1a
license: GPL-3.0-or-later
dep-pkg: libncurses libiconv
parallel: 0

dopatch: gsed -i '262d' gettext-runtime/gnulib-lib/progreloc.c gettext-tools/gnulib-lib/progreloc.c

install: |
    configure \
        --with-included-regex \
        --with-included-gettext \
        --with-included-libxml \
        --with-included-libunistring \
        --with-libiconv-prefix=$libiconv_INSTALL_DIR \
        --with-libncurses-prefix=$libncurses_INSTALL_DIR \
        --disable-acl \
        --disable-openmp \
        --disable-csharp \
        --disable-java \
        --enable-c++ \
        --enable-curses \
        --enable-threads=posix \
        --enable-libasprintf \
        --enable-namespacing \
        --enable-nls \
        --enable-relocatable
