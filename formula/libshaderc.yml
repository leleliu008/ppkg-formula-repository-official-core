summary: A collection of tools, libraries, and tests for Vulkan shader compilation
src-url: https://github.com/google/shaderc/archive/refs/tags/v2026.4.tar.gz
src-sha: f06ce5bcca94e5df7f34e115743597d0ad2e13c5fe9213c67dc8c76031241947
license: Apache-2.0
dep-pkg: glslang
dep-upp: python3

dopatch: |
    cat > third_party/deps.cmake <<EOF
    find_package(SPIRV-Tools)
    find_package(glslang)

    #add_library(SPIRV-Tools ALIAS SPIRV-Tools-shared)
    add_library(glslang     ALIAS glslang::glslang)
    EOF

    gsed -i '1i include(deps.cmake)' third_party/CMakeLists.txt

    export CPPFLAGS="$CPPFLAGS -I$glslang_INCLUDE_DIR/glslang"

    gsed -i 's|${spirv-tools_SOURCE_DIR}|${CMAKE_CURRENT_SOURCE_DIR}/third_party/spirv-tools|' CMakeLists.txt
    gsed -i 's|${glslang_SOURCE_DIR}|${CMAKE_CURRENT_SOURCE_DIR}/third_party/glslang|' CMakeLists.txt

prepare: |
    git_checkout https://github.com/KhronosGroup/SPIRV-Headers --ref-from=04fd3caa1e8267e4d95c806cad901181728e1006 -C third_party/spirv-headers
    git_checkout https://github.com/KhronosGroup/SPIRV-Tools   --ref-from=ef96ed763b43b59b33b31b362f09a02b729fa1c9 -C third_party/spirv-tools
    git_checkout https://github.com/KhronosGroup/glslang       --ref-from=e1b562a8bed273a02f30b59b66a5d499793cede5 -C third_party/glslang

install: |
    cmakew \
        -DSHADERC_SKIP_TESTS=ON \
        -DSHADERC_SKIP_EXAMPLES=OFF \
        -DSHADERC_SKIP_EXECUTABLES=OFF \
        -DSHADERC_SKIP_INSTALL=OFF \
        -DSHADERC_ENABLE_WGSL_OUTPUT=OFF \
        -DSHADERC_ENABLE_WERROR_COMPILE=ON
