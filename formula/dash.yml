summary: A POSIX-compliant implementation of /bin/sh that aims to be as small as possible
git-url: https://git.kernel.org/pub/scm/utils/dash/dash.git
web-url: http://gondor.apana.org.au/~herbert/dash
src-url: http://gondor.apana.org.au/~herbert/dash/files/dash-0.5.13.5.tar.gz
src-sha: 40090101a2a491f13e901d3d48e90414f26634628b9bfff35ff540363c227a7d
license: BSD-3-Clause
dep-pkg: libedit

install: |
    configure \
        --with-libedit=$libedit_INSTALL_DIR \
        --disable-static \
        --enable-glob=no \
        --enable-test-workaround=no \
        --enable-fnmatch \
        --enable-lineno
