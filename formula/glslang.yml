summary: OpenGL and OpenGL ES reference compiler for shading languages
web-url: https://www.khronos.org/opengles/sdk/tools/Reference-Compiler/
src-url: https://github.com/KhronosGroup/glslang/archive/refs/tags/16.6.0.tar.gz
src-sha: 9c09b901149c729df745057dafa815278aaa101b84d2b6e14f16a42de52f97f2
license: BSD-3-Clause GPL-3.0-or-later MIT Apache-2.0
dep-pkg: libspirv-tools
dep-upp: python3

install: |
    cmakew \
        -DBUILD_EXTERNAL=OFF \
        -DALLOW_EXTERNAL_SPIRV_TOOLS=ON \
        -DENABLE_OPT=ON \
        -DENABLE_CTEST=OFF \
        -DBUILD_SHARED_LIBS=ON
