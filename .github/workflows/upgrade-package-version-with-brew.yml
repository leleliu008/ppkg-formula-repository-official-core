name: update package version with brew

on:
  workflow_dispatch:

  schedule:
    - cron: '0 1 * * *'

jobs:
  find-upgradable-packages:

    runs-on: macos-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - run: brew update

      - uses: actions/checkout@v5

      - run: curl -LO https://github.com/leleliu008/test/releases/download/2023.10.08/xcpkg-0.30.0-macos-15.0-arm64.release.tar.xz
      - run: /usr/bin/bsdtar xf *.tar.xz --strip-components=1
      - run: rm *.tar.xz
      - run: mv bin/xcpkg .

      - run: ./xcpkg about
      - run: ./xcpkg sysinfo

      - run: ./compare-package-version-with-brew --upgrade

      - run: mv formula/upgrade .

      - uses: actions/upload-artifact@v6
        with:
          name: upgradable-packages-${{ github.sha }}
          path: upgrade/

      - id: upgradable-packages
        run: |
          set -ex
          NAMES="$(cd upgrade && ls | jq -Rnc '[inputs]')"
          printf 'names=%s\n' "$NAMES" >> $GITHUB_OUTPUT

    outputs:
      names: ${{ steps.upgradable-packages.outputs.names }}


  upgrade:

    needs: find-upgradable-packages

    strategy:

      fail-fast: false

      matrix:
        pkg: ${{ fromJson(needs.find-upgradable-packages.outputs.names) }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      ############################################################

      - uses: actions/download-artifact@v8
        with:
          name: upgradable-packages-${{ github.sha }}
          path: upgrade

      - id: upgrade-info
        run: cat upgrade/${{ matrix.pkg }} >> "$GITHUB_OUTPUT"

      ############################################################

      - run: |
          sed -i \
              -e '/^version: /c version: ${{ steps.upgrade-info.outputs.VERSION_NEW }}' \
              -e '/^src-url: /c src-url: ${{ steps.upgrade-info.outputs.SRC_URL_NEW }}' \
              -e '/^src-sha: /c src-sha: ${{ steps.upgrade-info.outputs.SRC_SHA_NEW }}' \
              -e '/^git-sha: /c git-sha: ${{ steps.upgrade-info.outputs.GIT_SHA_NEW }}' \
              -e '/^git-tag: /c git-tag: ${{ steps.upgrade-info.outputs.GIT_TAG_NEW }}' \
              -e '/^src-uri: /s|${{ steps.upgrade-info.outputs.VERSION_OLD }}|${{ steps.upgrade-info.outputs.VERSION_NEW }}|' \
              formula/${{ matrix.pkg }}.yml

      ############################################################

      - run: git diff

      ############################################################

      - run: curl -LO https://raw.githubusercontent.com/leleliu008/ppkg/${{ github.ref_name }}/ppkg
      - run: chmod +x ppkg

      ############################################################

      - run: |
          cat > run.sh <<EOF
          set -ex

          run() {
            printf "\033[0;35m==>\033[0m \033[0;32m%b\n\033[0m" "\$*"
            eval "\$@"
          }

          if [ -f  /sbin/apk ] ; then
            run    /sbin/apk update
            run    /sbin/apk add llvm clang clang-dev linux-headers

            PPKG_INSTALL_ARGS=--static
          else
            command -v curl > /dev/null || {
              run apt -y update
              run apt -y install curl
            }

            PPKG_INSTALL_ARGS=
          fi

          export GITHUB_ACTIONS=true

          run ./ppkg setup
          run ./ppkg sysinfo
          run ./ppkg install ${{ matrix.pkg }} -I formula "\$PPKG_INSTALL_ARGS"
          run ./ppkg bundle  ${{ matrix.pkg }} .tar.xz
          EOF

      ############################################################

      - run: docker run --rm -v $PWD:/home/leleliu008/w -w /home/leleliu008/w alpine       /bin/sh run.sh
      - run: docker run --rm -v $PWD:/home/leleliu008/w -w /home/leleliu008/w ubuntu:26.04 /bin/sh run.sh
      - run: docker run --rm -v $PWD:/home/leleliu008/w -w /home/leleliu008/w ubuntu:24.04 /bin/sh run.sh
      - run: docker run --rm -v $PWD:/home/leleliu008/w -w /home/leleliu008/w ubuntu:22.04 /bin/sh run.sh

      ############################################################

      - run: curl -LO https://raw.githubusercontent.com/alpinelinux/alpine-chroot-install/master/alpine-chroot-install
      - run: chmod +x alpine-chroot-install

      - run: |
          sed -i -e '/APK_TOOLS_URI:=/c APK_TOOLS_URI=https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v3.0.7/x86_64/apk.static' \
                 -e '/APK_TOOLS_SHA256:=/c APK_TOOLS_SHA256=c07bf5356eacc9dd7a8c56bc537f46702f007170287403299d52a04264e74b3c' \
                 -e 's|qemu-user-static|qemu-user-binfmt|' \
                 -e 's|qemu_arch-static|qemu_arch|' \
                 alpine-chroot-install

      - run: sudo ./alpine-chroot-install -d /alpine-loongarch64 -a loongarch64
      - run: /alpine-loongarch64/enter-chroot sh run.sh

      - run: sudo ./alpine-chroot-install -d /alpine-aarch64 -a aarch64
      - run: /alpine-aarch64/enter-chroot sh run.sh

      - run: sudo ./alpine-chroot-install -d /alpine-ppc64le -a ppc64le
      - run: /alpine-ppc64le/enter-chroot sh run.sh

      - run: sudo ./alpine-chroot-install -d /alpine-s390x -a s390x
      - run: /alpine-s390x/enter-chroot sh run.sh

      ############################################################

      - run: git config --global user.name  leleliu008
      - run: git config --global user.email leleliu008@gmail.com

      - run: git add formula/${{ matrix.pkg }}.yml
      - run: git commit -m 'update package ${{ matrix.pkg }} ${{ steps.upgrade-info.outputs.VERSION_OLD }} -> ${{ steps.upgrade-info.outputs.VERSION_NEW }}'
      - run: git pull --rebase=true
      - run: git push origin master
